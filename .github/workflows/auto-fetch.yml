name: Auto-fetch drivers for reported hardware

# Every hour: collect the reports the Worker has stored, resolve new hardware IDs, publish the signed catalog.
# By hand: run it with one hardware ID.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      hwid:
        description: 'One hardware ID to resolve now (empty = collect the stored reports)'
        required: false

# one run at a time: each run commits and publishes the catalog
concurrency:
  group: auto-fetch
  cancel-in-progress: false

permissions:
  contents: write   # upload driver zips, publish the catalog, commit driverdb.json

jobs:
  fetch:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      WORKER_URL: ${{ vars.REPORT_WORKER_URL }}
      READ_KEY: ${{ secrets.REPORT_READ_KEY }}
      MANUAL_HWID: ${{ inputs.hwid }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the reports (the text is only parsed as data, never executed)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $devices = @(); $keys = @()
          if ($env:MANUAL_HWID) {
            $devices = @(@{ ids = @($env:MANUAL_HWID); class = ''; name = 'manual' })
          } elseif ($env:WORKER_URL -and $env:READ_KEY) {
            $r = Invoke-RestMethod -Uri "$($env:WORKER_URL)/pending" -Headers @{ Authorization = "Bearer $($env:READ_KEY)" } -TimeoutSec 60
            foreach ($i in @($r.items)) { $keys += $i.key; $devices += @($i.devices) }
          }
          "Reports: $($devices.Count) device(s) in $($keys.Count) report(s)"
          if (-not $devices.Count) { "HAVE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8; return }
          "HAVE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          [IO.File]::WriteAllText("$PWD\dist\reports.json", (@{ v = 1; devices = $devices } | ConvertTo-Json -Depth 6), (New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText("$PWD\dist\keys.json", (ConvertTo-Json -InputObject @($keys)), (New-Object Text.UTF8Encoding($false)))

      - uses: Swatinem/rust-cache@v2
        if: env.HAVE == '1'
        with:
          workspaces: app

      - name: Build the fetcher
        if: env.HAVE == '1'
        run: cargo build --release --bin fetcher --manifest-path app/Cargo.toml

      - name: Resolve hardware IDs through the Microsoft Update Catalog
        if: env.HAVE == '1'
        shell: pwsh
        run: |
          ./app/target/release/fetcher.exe --reports dist/reports.json --catalog DriverScan/driverdb.json --out dist/pkgs --repo ${{ github.repository }} --max 10 | Tee-Object dist/result.txt
          if ($LASTEXITCODE) { throw "fetcher failed ($LASTEXITCODE)" }
          $zips = @(Get-Content dist/pkgs/uploaded.txt | Where-Object { $_ })
          "ZIP_COUNT=$($zips.Count)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Mirror the packages (release "drivers")
        if: env.HAVE == '1' && env.ZIP_COUNT != '0'
        shell: pwsh
        run: |
          gh release view drivers 2>$null | Out-Null
          if ($LASTEXITCODE) { gh release create drivers --title 'Driver mirror' --notes 'Driver packages referenced by the catalog (SHA-256 checked by the program).' --prerelease }
          $zips = @(Get-Content dist/pkgs/uploaded.txt | Where-Object { $_ })
          gh release upload drivers @zips --clobber

      - name: Sign and publish the catalog
        if: env.HAVE == '1' && env.ZIP_COUNT != '0'
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY_XML: ${{ secrets.UPDATE_PRIVATE_KEY_XML }}
        run: |
          if (-not $env:UPDATE_PRIVATE_KEY_XML) { throw 'Secret UPDATE_PRIVATE_KEY_XML is not set' }
          $dir = Join-Path $env:USERPROFILE '.tiers-update'
          New-Item -ItemType Directory -Force $dir | Out-Null
          [IO.File]::WriteAllText((Join-Path $dir 'private.xml'), $env:UPDATE_PRIVATE_KEY_XML)
          try { ./Publish-Catalog.ps1 } finally { Remove-Item (Join-Path $dir 'private.xml') -Force -ErrorAction SilentlyContinue }

      - name: Commit the catalog
        if: env.HAVE == '1' && env.ZIP_COUNT != '0'
        shell: pwsh
        run: |
          git config user.name 'tiers-auto-fetcher'
          git config user.email 'actions@users.noreply.github.com'
          git add DriverScan/driverdb.json
          git commit -m "Catalog: add drivers for reported hardware"
          git pull --rebase
          git push

      # only after everything above worked: the reports are removed from the Worker (a failed run is retried next hour)
      - name: Acknowledge the reports
        if: env.HAVE == '1' && env.WORKER_URL != '' && env.MANUAL_HWID == ''
        shell: pwsh
        run: |
          $keys = Get-Content dist/keys.json -Raw
          Invoke-RestMethod -Method Post -Uri "$($env:WORKER_URL)/ack" -Headers @{ Authorization = "Bearer $($env:READ_KEY)" } -ContentType 'application/json' -Body "{`"keys`":$keys}" -TimeoutSec 60