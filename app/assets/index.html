<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TierS Driver Manage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --navy:#0f2547; --page:#f4f6f9; --border:#dadfe7; --line:#e8ecf2; --text:#1b2733; --muted:#4e5a6e;
  --accent:#2563eb; --accent-dark:#1d4ed8; --accent-soft:#eaf1ff;
  --good:#117436; --good-soft:#e8f5ec; --warn:#9e4606; --warn-soft:#fef3e2; --bad:#b91c1c; --bad-soft:#fdecec;
  --off:#e2e8f0; --off-text:#64748b; --hover:#f3f6fb;
  --font:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI","Leelawadee UI",system-ui,sans-serif;
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { font:14px/1.4 var(--font); color:var(--text); background:var(--page); display:flex; flex-direction:column; overflow:hidden; user-select:none; -webkit-user-select:none; cursor:default; }
svg { display:block; flex:none; }
.ico { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .accent{color:var(--accent)} .muted{color:var(--muted)}

/* top bar */
.top { height:56px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 14px; gap:12px; flex:none; }
.top img { width:34px; height:34px; }
.top h1 { margin:0; font-size:18px; font-weight:600; color:var(--navy); }
.top .sep { width:1px; height:20px; background:var(--border); }
.top .machine { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.top .grow { flex:1; }
.top .ver { color:var(--muted); font-size:13px; }

/* buttons */
.btn { font:600 13.5px var(--font); border-radius:6px; border:1px solid #aabeeb; background:#fff; color:var(--accent-dark); padding:0 16px; height:34px; cursor:pointer; white-space:nowrap; }
.btn:hover:not(:disabled) { background:var(--accent-soft); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-size:14.5px; }
.btn.primary:hover:not(:disabled) { background:var(--accent-dark); }
.btn.link { border-color:transparent; background:transparent; padding:0 10px; }
.btn:disabled { background:var(--off); border-color:var(--off); color:var(--off-text); cursor:default; }
.btn.link:disabled { background:transparent; border-color:transparent; }
.btn:focus-visible, .cb:focus-visible, .tab:focus-visible, .pill:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

/* toolbar */
.tool { padding:14px 20px 0; flex:none; }
.tool .row { display:flex; align-items:center; gap:10px; height:40px; }
.tool .btn.primary { height:40px; width:168px; }
.status { display:flex; align-items:center; gap:7px; font-size:14px; }
.bar { height:3px; margin-top:10px; background:transparent; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--accent); }
.bar.indet i { width:30%; animation:slide 1.2s ease-in-out infinite; }
@keyframes slide { 0%{margin-left:-30%} 100%{margin-left:100%} }

/* tabs */
.tabs { display:flex; align-items:flex-end; padding:0 20px; flex:none; margin-top:0; }
.tab { height:40px; padding:0 14px; font:600 14.5px var(--font); color:var(--muted); background:none; border:0; cursor:pointer; position:relative; }
.tab:hover { color:var(--text); }
.tab.on { color:var(--accent); }
.tab.on::after { content:""; position:absolute; left:8px; right:8px; bottom:0; height:3px; border-radius:2px 2px 0 0; background:var(--accent); }
.pills { margin-left:auto; display:flex; gap:8px; align-self:center; padding-bottom:4px; }
.pill { display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:3px 10px; font:600 13px var(--font); color:var(--text); cursor:pointer; }
.pill:hover { border-color:var(--accent); }
.pill .ico { width:16px; height:16px; }

/* card */
.main { flex:1; min-height:0; padding:0 20px 14px; display:flex; }
.card { flex:1; min-width:0; background:#fff; border:1px solid var(--border); border-radius:0 8px 8px 8px; display:flex; flex-direction:column; overflow:hidden; }
.banner { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--border); flex:none; }
.banner .t { flex:1; min-width:0; }
.banner.info{background:var(--accent-soft)} .banner.info .ico{color:var(--accent)}
.banner.good{background:var(--good-soft)} .banner.good .ico{color:var(--good)}
.banner.warn{background:var(--warn-soft)} .banner.warn .ico{color:var(--warn)}
.banner.bad{background:var(--bad-soft)} .banner.bad .ico{color:var(--bad)}
.banner .btns { display:flex; flex-direction:row-reverse; align-items:center; gap:6px; }
.scroll { flex:1; min-height:0; overflow:auto; }

/* table */
.tr { display:grid; align-items:center; min-height:46px; border-bottom:1px solid var(--line); padding-right:8px; }
.tr:not(.th):hover { background:var(--hover); }
.tr.sel { background:var(--accent-soft); }
.th { position:sticky; top:0; background:#fff; min-height:34px; z-index:1; border-bottom:1px solid var(--border); font:600 12.5px var(--font); color:var(--muted); }
.tr > div { padding:0 4px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tr > div.wrap { white-space:normal; font-size:12.5px; font-weight:600; line-height:1.3; padding:4px; }
.g-up { grid-template-columns:44px 32px minmax(200px,1fr) 112px 124px 92px 72px minmax(190px,300px); }
.g-up.res { grid-template-columns:14px 32px minmax(200px,1fr) 112px 124px 92px 72px minmax(190px,300px); }
.g-in { grid-template-columns:44px minmax(200px,1fr) 124px 170px 130px 100px 120px; min-height:40px; }
.g-bk { grid-template-columns:190px minmax(220px,1fr) 170px 150px; min-height:42px; }
.g-bk > div:first-child, .g-in > div:first-child { padding-left:14px; }
.tone-good{color:var(--good)} .tone-bad{color:var(--bad)} .tone-warn{color:var(--warn)} .tone-accent{color:var(--accent)} .tone-muted{color:var(--muted)}
.s { font-weight:600; }
.ic { display:flex; justify-content:center; }

/* checkbox */
.cb { appearance:none; -webkit-appearance:none; width:18px; height:18px; margin:0 0 0 12px; border:1.5px solid #94a3b8; border-radius:4px; background:#fff; cursor:pointer; position:relative; }
.cb:hover:not(:disabled) { border-color:var(--accent); }
.cb:checked { background:var(--accent); border-color:var(--accent); }
.cb:checked::after { content:""; position:absolute; left:5px; top:1px; width:4px; height:9px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
.cb:disabled { opacity:.5; cursor:default; }

/* empty + log */
.empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 20px 60px; }
.empty h2 { margin:0 0 6px; font-size:22px; font-weight:600; color:var(--navy); }
.empty p { margin:0; color:var(--muted); font-size:14.5px; white-space:pre-line; }
.empty.good h2 { color:var(--good); } .empty.accent h2 { color:var(--accent); }
.log { margin:0; padding:14px; font:12.5px/1.5 Consolas,"Cascadia Mono",monospace; white-space:pre-wrap; user-select:text; -webkit-user-select:text; cursor:text; }

/* footer */
.foot { height:66px; background:#fff; border-top:1px solid var(--border); display:flex; align-items:center; padding:0 20px; gap:12px; flex:none; }
.foot label { display:flex; align-items:center; gap:8px; cursor:pointer; }
.foot .cb { margin:0; }
.foot .sep { width:1px; height:20px; background:var(--border); margin:0 6px; }
.foot .grow { flex:1; }
.foot .btn.primary { height:42px; min-width:200px; }
.cnt { color:var(--muted); }

/* power plan */
.pw { padding:18px 22px 26px; max-width:1040px; }
.pw section { margin-bottom:24px; }
.pw h3 { margin:0 0 10px; font-size:15px; font-weight:600; color:var(--navy); }
.hwgrid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px 20px; }
.hwgrid .k { color:var(--muted); font-size:12.5px; }
.hwgrid .v { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rec { padding:10px 14px; border-radius:6px; background:var(--accent-soft); display:flex; gap:10px; align-items:flex-start; }
.rec .ico { color:var(--accent); margin-top:2px; }
.rec small { color:var(--muted); display:block; margin-top:2px; }
.prow { display:grid; grid-template-columns:28px 190px minmax(0,1.2fr) minmax(0,1fr) 110px; align-items:center; gap:8px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; cursor:pointer; }
.prow:hover { background:var(--hover); }
.prow.on { border-color:var(--accent); background:var(--accent-soft); }
.prow .n { font-weight:600; }
.prow .m { color:var(--muted); font-size:13px; }
.badge { font:600 11.5px var(--font); color:var(--accent-dark); border:1px solid #aabeeb; border-radius:10px; padding:1px 8px; justify-self:end; background:#fff; }
.radio { appearance:none; -webkit-appearance:none; width:18px; height:18px; margin:0; border:1.5px solid #94a3b8; border-radius:50%; background:#fff; cursor:pointer; position:relative; }
.radio:checked { border-color:var(--accent); }
.radio:checked::after { content:""; position:absolute; inset:3px; border-radius:50%; background:var(--accent); }
.opts { display:grid; gap:8px; }
.opts label { display:flex; align-items:center; gap:10px; cursor:pointer; }
.opts label.off { color:var(--off-text); cursor:default; }
.opts .cb { margin:0; }
.ptbl .tr { grid-template-columns:210px minmax(0,1fr) minmax(0,1.1fr) 250px; min-height:38px; padding-right:0; }
.ptbl { border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.ptbl .th { position:static; }
.ptbl .tr > div { padding:0 10px; }
.ptbl .tr:last-child { border-bottom:0; }
.note-warn { color:var(--warn); font-weight:600; margin:0 0 10px; }
.rep { border:1px solid var(--line); border-radius:6px; padding:14px 16px; }
.rep h4 { margin:12px 0 4px; font-size:13px; color:var(--muted); font-weight:600; }
.rep h4:first-child { margin-top:0; }
.rep ul { margin:0; padding-left:18px; } .rep li { margin:2px 0; }
.rep .two { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.rep .kv { display:grid; grid-template-columns:200px 1fr; gap:2px 10px; font-size:13px; }
.rep .kv span:nth-child(odd) { color:var(--muted); }
.chip { display:inline-flex; align-items:center; gap:6px; font-weight:600; }
.cmp { margin-top:12px; }
.cmp .tr { grid-template-columns:260px 1fr 1fr; min-height:34px; padding-right:0; }
.cmp .tr > div { padding:0 10px; }
.cmp .diff { background:var(--warn-soft); }

/* modal */
.shade { position:fixed; inset:0; background:rgba(15,37,71,.35); display:flex; align-items:center; justify-content:center; z-index:10; }
.dlg { width:440px; background:#fff; border-radius:10px; padding:22px; box-shadow:0 12px 40px rgba(15,37,71,.3); }
.dlg h3 { margin:0 0 8px; font-size:17px; color:var(--navy); }
.dlg p { margin:0 0 6px; color:var(--muted); }
.dlg .acts { margin-top:18px; display:flex; justify-content:flex-end; gap:8px; }
</style>
</head>
<body oncontextmenu="return false">
<div id="app"></div>
<script>
const I = {
  check:'<path d="M4 12.5l5 5L20 6.5"/>', cross:'<path d="M6 6l12 12M18 6L6 18"/>', info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/>',
  up:'<path d="M12 20V5M6 10.5l6-6 6 6"/>', dot:'<circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/>', ring:'<circle cx="12" cy="12" r="7"/>',
  minus:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>', shield:'<path d="M12 3l7.5 3v6c0 4.2-3 7.4-7.5 9-4.5-1.6-7.5-4.8-7.5-9V6z"/><path d="M8.8 12l2.3 2.3 4.2-4.6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>'
};
const ico = (n, cls='') => n ? `<svg class="ico ${cls}" viewBox="0 0 24 24">${I[n]}</svg>` : '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const send = (cmd, o={}) => window.ipc.postMessage(JSON.stringify({cmd, ...o}));
let S = null;

const stateIcon = {ok:['check','good'], fail:['cross','bad'], skip:['minus','warn'], dl:['dot','accent'], inst:['dot','accent'], wait:['ring','muted']};

function updatesTable() {
  const res = S.mode !== 'review';
  let h = `<div class="tr th g-up ${res?'res':''}"><div></div><div></div><div>Driver / device</div><div>Type</div><div>Source</div><div>Date</div><div>Size</div><div>${res?'Status':'Notes'}</div></div>`;
  for (const r of S.rows) {
    const [ic, tone] = stateIcon[r.state] || (r.system ? ['shield','warn'] : [null,null]);
    h += `<div class="tr g-up ${res?'res':''}">
      <div>${res ? '' : `<input class="cb" type="checkbox" data-tick="${r.i}" ${r.ticked?'checked':''}>`}</div>
      <div class="ic">${ico(ic, tone)}</div>
      <div title="${esc(r.title)}">${esc(r.title)}</div><div>${esc(r.cls)}</div><div>${esc(r.source)}</div><div>${esc(r.date)}</div><div>${esc(r.size)}</div>
      <div class="wrap tone-${r.tone}" title="${esc(r.tip)}">${esc(r.note)}</div></div>`;
  }
  for (const d of S.infos) {
    h += `<div class="tr g-up"><div></div><div class="ic">${ico('info','muted')}</div>
      <div title="${esc(d.name + '\nHardware ID: ' + d.hwid + '\nNo driver was found in Windows Update or the Microsoft Catalog. Try the manufacturer\'s website using this Hardware ID.')}">${esc(d.name)}</div>
      <div>${esc(d.cls)}</div><div>—</div><div></div><div></div><div class="s tone-muted">No driver found</div></div>`;
  }
  return h;
}

function installedTable() {
  let h = `<div class="tr th g-in"><div></div><div>Device</div><div>Type</div><div>Manufacturer</div><div>Version</div><div>Driver date</div><div>Status</div></div>`;
  for (const d of S.inventory) {
    h += `<div class="tr g-in"><div>${d.old ? ico('clock','warn') : ''}</div><div title="${esc(d.name)}">${esc(d.name)}</div><div>${esc(d.cls)}</div><div>${esc(d.maker)}</div><div>${esc(d.version)}</div><div>${esc(d.date)}</div>
      <div class="s ${d.old?'tone-warn':'tone-muted'}">${d.old ? `Old (${d.age} yr)` : (d.known ? '<span style="font-weight:400">OK</span>' : '')}</div></div>`;
  }
  return h;
}

function backupsTable() {
  if (!S.backups.length) return `<div class="empty"><p>No backups yet\nBefore a driver is replaced, the one it replaces is saved here so you can roll back.</p></div>`;
  let h = `<div class="tr th g-bk"><div>Backed up</div><div>Device</div><div>Saved version</div><div>Backup</div></div>`;
  S.backups.forEach((b, i) => { h += `<div class="tr g-bk ${S.selectedBackup===i?'sel':''}" data-pick="${i}" style="cursor:pointer"><div>${esc(b.time)}</div><div>${esc(b.device)}</div><div>${esc(b.version)}</div><div>${esc(b.kind)}</div></div>`; });
  return h;
}

function powerPanel() {
  const P = S.power;
  if (!P.loaded) return `<div class="empty"><h2>${P.busy ? "Reading this PC" : "Power Plan Manager"}</h2><p>${P.busy ? "Checking the CPU, memory and current power plan..." : "Open this tab to read the hardware."}</p></div>`;
  const h = P.hw || {};
  const sel = P.profiles.find(p => p.key === P.selected) || P.profiles[0];
  const hwItems = [["CPU vendor",h.vendor],["CPU model",h.cpu],["Cores / threads",h.cores],["RAM",h.ram],["Windows",h.windows],["PC type",h.type],["Power source",h.source],["Current power plan",h.plan]];
  const off = (ok) => ok ? "" : "off";
  const opt = (name, on, enabled, text, extra="") => `<label class="${off(enabled)}"><input class="cb" type="checkbox" data-popt="${name}" ${on?"checked":""} ${enabled && !P.busy?"":"disabled"}><span>${text}${enabled?"":" <span class=muted>(not part of this profile)</span>"}</span>${extra}</label>`;
  let h2 = `<div class="pw">
    <section><h3>Hardware information</h3><div class="hwgrid">${hwItems.map(([k,v]) => `<div><div class="k">${k}</div><div class="v" title="${esc(v)}">${esc(v)}</div></div>`).join("")}</div></section>
    <section><div class="rec">${ico("info")}<div><b>Recommended: ${esc(P.recommendedName)}</b><small>${esc(P.why.join(" · "))}</small></div></div></section>
    <section><h3>Performance profile</h3>${P.profiles.map(p => `<label class="prow ${P.selected===p.key?"on":""}"><input class="radio" type="radio" name="tier" data-tier="${p.key}" ${P.selected===p.key?"checked":""} ${P.busy?"disabled":""}>
      <span class="n">${esc(p.title)}</span><span class="m">${esc(p.suited)}</span><span class="m">${esc(p.goal)}</span>${P.recommended===p.key?`<span class="badge">Recommended</span>`:"<span></span>"}</label>`).join("")}</section>
    <section><h3>Options</h3><div class="opts">
      ${opt("restore", P.opts.restore_point, true, "Create a system restore point first")}
      ${opt("usb", P.opts.usb_off, sel.usb, "Turn off USB selective suspend (optional)")}
      ${opt("pcie", P.opts.pcie_off, sel.pcie, "Set PCI Express link state to Off (optional)")}
      ${opt("ultimate", P.opts.ultimate, sel.ultimate, "Use the Ultimate Performance plan (optional)", sel.ultimate ? `<button class="btn" data-act="power_compare" ${P.busy?"disabled":""}>Compare with Balanced</button>` : "")}
    </div></section>
    <section><h3>Changes that will be applied</h3>${P.batteryBlock ? `<p class="note-warn">The Extreme profile is not applied while the PC runs on battery. Plug in the charger first.</p>` : ""}
      <div class="ptbl"><div class="tr th"><div>Setting</div><div>Now</div><div>After</div><div>Note</div></div>${P.preview.map(r => `<div class="tr"><div>${esc(r.label)}</div><div title="${esc(r.current)}">${esc(r.current)}</div><div title="${esc(r.new)}">${esc(r.new)}</div><div class="muted">${esc(r.note)}</div></div>`).join("")}</div></section>`;
  if (P.cmp) h2 += `<section><h3>Ultimate Performance vs Balanced</h3><p style="margin:0 0 6px">${esc(P.cmp.advice)}</p>${P.cmp.available ? `<div class="ptbl cmp"><div class="tr th"><div>Setting</div><div>Balanced</div><div>Ultimate Performance</div></div>${P.cmp.rows.map(r => `<div class="tr ${r.differs?"diff":""}"><div>${esc(r.label)}</div><div>${esc(r.balanced)}</div><div>${esc(r.ultimate)}</div></div>`).join("")}</div>` : ""}</section>`;
  if (P.report) {
    const R = P.report, ul = (t, a) => `<h4>${t}</h4>${a.length ? `<ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<div class="muted">None</div>`}`;
    const kv = a => `<div class="kv">${a.map(l => `<span>${esc(l.label)}</span><span>${esc(l.value)}</span>`).join("")}</div>`;
    h2 += `<section><h3>Report: ${esc(R.title)} <span class="chip ${R.ok?"good":"bad"}">${ico(R.ok?"check":"cross")}${R.ok?"Success":"Failed"}</span></h3><div class="rep">
      <div class="two"><div><h4>Previous configuration</h4>${kv(R.previous)}</div><div><h4>New configuration</h4>${kv(R.new)}</div></div>
      ${ul("Successfully applied", R.applied)}${ul("Unsupported settings", R.unsupported)}${ul("Failed settings", R.failed)}<h4>Restore status</h4><div>${esc(R.restore)}</div></div></section>`;
  }
  return `<div class="scroll">${h2}</div></div>`;
}

function body() {
  if (S.tab === "power") return powerPanel();
  if (S.tab === 'installed') return `<div class="scroll">${installedTable()}</div>`;
  if (S.tab === 'backups') return `<div class="scroll">${backupsTable()}</div>`;
  if (S.tab === 'log') return `<div class="scroll"><pre class="log">${esc(S.log)}</pre></div>`;
  let b = '';
  if (S.banner) b = `<div class="banner ${S.banner.kind}">${ico({info:'dot',good:'check',warn:'info',bad:'cross'}[S.banner.kind])}<div class="t">${esc(S.banner.text)}</div><div class="btns">${
    S.banner.buttons.map(x => `<button class="btn ${x.primary?'primary':''} ${x.link?'link':''}" data-banner="${x.id}" ${x.enabled?'':'disabled'}>${esc(x.text)}</button>`).join('')}</div></div>`;
  if (!S.rows.length && !S.infos.length) {
    let c, t, p;
    if (S.busy) { c='accent'; t='Scanning this PC'; p='This can take about 1–2 minutes.'; }
    else if (S.scanned) { c='good'; t='Drivers are up to date'; p='No newer drivers were found in the sources checked.'; }
    else { c=''; t='Scan this PC for driver updates'; p='Scan finds newer drivers, you review the list, then install.\nIt takes about 1–2 minutes and needs an internet connection.'; }
    return b + `<div class="empty ${c}"><h2>${t}</h2><p>${p}</p></div>`;
  }
  const rp = S.report.available && S.report.count > 0 ? `<div class="banner info" style="border-top:1px solid var(--border);border-bottom:0"><div class="t">${S.report.count} device(s) have no driver in any source. You can send their hardware IDs (no personal data) so a driver can be added.</div>
    <div class="btns"><button class="btn" data-act="report" ${S.report.done||S.report.sending||S.busy?"disabled":""}>${S.report.done?"Reported":(S.report.sending?"Sending...":"Report these devices")}</button></div></div>` : "";
  return b + `<div class="scroll">${updatesTable()}</div>` + rp;
}

function pills() {
  const p = S.pills;
  if (!S.scanned) return `<button class="pill" data-tab="installed">${ico('ring','muted')}Not scanned yet</button>`;
  const miss = p.missing > 0 ? ['info','bad',`${p.missing} without a driver`] : ['check','good','No problem devices'];
  return `<button class="pill" data-tab="installed">${ico('dot','muted')}${p.drivers} drivers</button>
    <button class="pill" data-tab="updates">${ico(p.upIcon, p.upTone)}${esc(p.upText)}</button>
    <button class="pill" data-tab="log">${ico(miss[0], miss[1])}${miss[2]}</button>`;
}

function powerFooter() {
  const P = S.power, b = P.busy || S.busy;
  const ic = {Success:["check","good"], Failed:["cross","bad"], Applying:["dot","accent"], "Restore Completed":["check","good"], Ready:["ring","muted"]}[P.status] || ["ring","muted"];
  return `<div class="foot"><button class="btn" data-act="power_backup" ${b?"disabled":""}>Backup settings</button><button class="btn" data-act="power_restore" ${b?"disabled":""}>Restore original</button><button class="btn" data-act="power_undo" ${b?"disabled":""}>Undo last</button><button class="btn link" data-act="power_reset" ${b?"disabled":""}>Reset to Windows default</button>
    <div class="grow"></div><span class="chip tone-${ic[1]}">${ico(ic[0], "tone-"+ic[1])}${esc(P.status)}</span><button class="btn primary" data-act="power_apply" ${b || P.batteryBlock || !P.loaded ? "disabled" : ""}>Apply profile</button></div>`;
}

function footer() {
  if (S.tab === "power") return powerFooter();
  const busy = S.busy;
  const showSel = S.tab === 'updates' && S.mode === 'review' && S.rows.length && !busy;
  let right = '';
  if (S.tab === 'backups') right = `<button class="btn primary" data-act="rollback" ${S.selectedBackup!=null && !busy ? '' : 'disabled'}>Roll back selected</button>`;
  else if (showSel) right = `<button class="btn primary" data-act="install" ${S.selN>0?'':'disabled'}>${S.selN>0 ? `Install ${S.selN} selected` : 'Install'}</button>`;
  return `<div class="foot">
    ${showSel ? `<label><input class="cb" type="checkbox" data-all ${S.allTicked?'checked':''}><span class="cnt">${S.selN} of ${S.rows.length} selected${S.selSize && S.selN ? ' · ' + esc(S.selSize) : ''}</span></label><span class="sep"></span>` : ''}
    <label title="A restore point lets you roll the PC back if a new driver causes problems.\nWindows allows one every 24 hours; if it cannot be created the program logs it and continues."><input class="cb" type="checkbox" data-rp ${S.restorePoint?'checked':''} ${busy?'disabled':''}><span style="${busy?'color:var(--off-text)':''}">Create a restore point first</span></label>
    <div class="grow"></div>${right}</div>`;
}

function render() {
  if (!S) return;
  const sc = document.querySelector('.scroll'); const top = sc ? sc.scrollTop : 0;
  const tabs = [['updates','Updates'],['installed','Installed drivers'],['backups','Backups'],['power','Power plan'],['log','Log']];
  const prog = S.busy ? (S.progress == null ? '<div class="bar indet"><i></i></div>' : `<div class="bar"><i style="width:${Math.round(S.progress*100)}%"></i></div>`) : '<div class="bar"></div>';
  document.getElementById('app').style.display = 'contents';
  document.getElementById('app').innerHTML = `
    <div class="top"><img src="__LOGO__" alt=""><h1>TierS Driver Manage</h1><span class="sep"></span><span class="machine" title="${esc(S.machine)}">${esc(S.machine)}</span><span class="grow"></span>
      ${S.update ? `<button class="btn" data-act="update" ${S.busy?'disabled':''} title="${esc(S.update.notes)}">Update to ${esc(S.update.version)}</button>` : ''}<span class="ver">v${esc(S.version)}</span></div>
    <div class="tool"><div class="row"><button class="btn primary" data-act="scan" ${S.busy?'disabled':''} title="F5">Scan drivers</button>
      <span class="status tone-${S.statusTone}">${ico(S.statusIcon, 'tone-'+S.statusTone)}${esc(S.status)}</span></div>${prog}</div>
    <div class="tabs">${tabs.map(([k,n]) => `<button class="tab ${S.tab===k?'on':''}" data-tab="${k}">${n}</button>`).join('')}<div class="pills">${pills()}</div></div>
    <div class="main"><div class="card">${body()}</div></div>
    ${footer()}
    ${S.power.confirmReset ? `<div class="shade"><div class="dlg"><h3>Reset to Windows default</h3><p>This restores the Windows built-in power plans and removes any custom plans.</p><p>Your custom plans are exported to a backup folder first, and nothing is removed if that backup fails.</p>
      <div class="acts"><button class="btn" data-act="power_reset_no">Cancel</button><button class="btn primary" data-act="power_reset_yes">Reset</button></div></div></div>` : ""}
    ${S.confirm ? `<div class="shade"><div class="dlg"><h3>Roll back driver</h3><p>Roll back ${esc(S.confirm.device)} to version ${esc(S.confirm.version)}?</p><p>The driver it uses now will be removed from this PC. A restart may be needed.</p>
      <div class="acts"><button class="btn" data-act="rollbackNo">Cancel</button><button class="btn primary" data-act="rollbackYes">Roll back</button></div></div></div>` : ''}`;
  const sc2 = document.querySelector('.scroll'); if (sc2) sc2.scrollTop = top;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-banner],[data-pick]'); if (!t || t.disabled) return;
  if (t.dataset.act) send(t.dataset.act);
  else if (t.dataset.tab) send('tab', {tab: t.dataset.tab});
  else if (t.dataset.banner) send('banner', {id: t.dataset.banner});
  else if (t.dataset.pick) send('pick', {i: +t.dataset.pick});
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.tick !== undefined) send('tick', {i: +t.dataset.tick, on: t.checked});
  else if (t.dataset.all !== undefined) send('tickAll', {on: t.checked});
  else if (t.dataset.rp !== undefined) send('restorePoint', {on: t.checked});
  else if (t.dataset.tier !== undefined) send('power_tier', {tier: t.dataset.tier});
  else if (t.dataset.popt !== undefined) send('power_opt', {name: t.dataset.popt, on: t.checked});
});
document.addEventListener('keydown', e => {
  if (e.key === 'F5') { e.preventDefault(); if (S && !S.busy) send('scan'); }
  if (e.ctrlKey && '12345'.includes(e.key)) send('tab', {tab: ['updates','installed','backups','power','log'][+e.key - 1]});
  if (e.key === 'Escape' && S && S.confirm) send('rollbackNo');
});
document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, {passive:false});
window.setState = s => { S = s; render(); };
window.ipc.postMessage(JSON.stringify({cmd:'ready'}));
</script>
</body>
</html>
