<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TierS Driver Manage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --navy:#0f2547; --page:#f4f6f9; --border:#dadfe7; --line:#e8ecf2; --text:#1b2733; --muted:#2b3647;
  --accent:#2563eb; --accent-dark:#1d4ed8; --accent-soft:#eaf1ff;
  --good:#117436; --good-soft:#e8f5ec; --warn:#9e4606; --warn-soft:#fef3e2; --bad:#b91c1c; --bad-soft:#fdecec;
  --off:#cfd8e3; --off-text:#2b3647; --hover:#f3f6fb;
  --font:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI","Leelawadee UI",system-ui,sans-serif;
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
button, input, select, textarea, pre { font-family:inherit; }
body { font:400 14px/1.55 var(--font); color:var(--text); background:var(--page); display:flex; flex-direction:column; overflow:hidden; user-select:none; -webkit-user-select:none; cursor:default; }
svg { display:block; flex:none; }
.ico { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .accent{color:var(--accent-dark)} .muted{color:var(--muted)}

/* top bar */
.top { height:56px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 14px; gap:12px; flex:none; }
.top img { width:34px; height:34px; }
.top h1 { margin:0; font-size:18px; font-weight:400; color:var(--navy); }
.top .sep { width:1px; height:20px; background:var(--border); }
.top .machine { color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.top .grow { flex:1; }
.top .ver { color:var(--muted); font-size:14px; }

/* buttons */
.btn { font:400 14px var(--font); border-radius:6px; border:1px solid #d3d9e3; border-bottom-color:#bcc4d1; background:#fff; color:var(--text); padding:0 18px; height:38px; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:background .12s, border-color .12s, box-shadow .12s, transform .06s; }
.btn:hover:not(:disabled) { background:var(--hover); border-color:#aabeeb; color:var(--accent-dark); }
.btn:active:not(:disabled) { background:var(--accent-soft); transform:translateY(1px); }
.btn.primary { background:var(--accent); border-color:var(--accent); border-bottom-color:var(--accent-dark); color:#fff; font-weight:600; }
.btn.primary:hover:not(:disabled) { background:var(--accent-dark); border-color:var(--accent-dark); color:#fff; }
.btn.primary:active:not(:disabled) { background:var(--accent-dark); }
.btn.link { border-color:transparent; background:transparent; color:var(--accent-dark); padding:0 10px; }
.btn.link:hover:not(:disabled) { background:var(--accent-soft); border-color:transparent; }
.btn:disabled { background:#eef1f5; border-color:#e3e7ed; color:#5d6a7c; cursor:default; }
.btn.link:disabled { background:transparent; border-color:transparent; }
.btn:focus-visible, .cb:focus-visible, .tab:focus-visible, .pill:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

/* toolbar */
.tool { padding:14px 20px 0; flex:none; }
.tool .row { display:flex; align-items:center; gap:10px; height:40px; }
.tool .btn.primary { height:42px; width:190px; }
.status { display:flex; align-items:center; gap:7px; font-size:14px; }
.bar { height:3px; margin-top:10px; background:transparent; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--accent); }
.bar.indet i { width:30%; animation:slide 1.2s ease-in-out infinite; }
@keyframes slide { 0%{margin-left:-30%} 100%{margin-left:100%} }

/* tabs */
.tabs { display:flex; align-items:flex-end; padding:0 20px; flex:none; margin-top:0; }
.tab { height:44px; padding:0 14px; font:400 14px var(--font); color:var(--muted); background:none; border:0; cursor:pointer; position:relative; }
.tab:hover { color:var(--text); }
.tab.on { color:var(--accent-dark); }
.tab.on::after { content:""; position:absolute; left:8px; right:8px; bottom:0; height:3px; border-radius:2px 2px 0 0; background:var(--accent); }
.pills { margin-left:auto; display:flex; gap:8px; align-self:center; padding-bottom:4px; }
.pill { display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:3px 10px; font:400 14px var(--font); color:var(--text); cursor:pointer; }
.pill:hover { border-color:var(--accent); }
.pill .ico { width:16px; height:16px; }

/* card */
.main { flex:1; min-height:0; padding:0 20px 14px; display:flex; }
.card { flex:1; min-width:0; background:#fff; border:1px solid var(--border); border-radius:0 8px 8px 8px; display:flex; flex-direction:column; overflow:hidden; }
.banner { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--border); flex:none; }
.banner .t { flex:1; min-width:0; }
.banner.info{background:var(--accent-soft)} .banner.info .ico{color:var(--accent)}
.banner.good{background:var(--good-soft)} .banner.good .ico{color:var(--good)}
.banner.warn{background:var(--warn-soft)} .banner.warn .ico{color:var(--warn)}
.banner.bad{background:var(--bad-soft)} .banner.bad .ico{color:var(--bad)}
.banner .btns { display:flex; flex-direction:row-reverse; align-items:center; gap:6px; }
.scroll { flex:1; min-height:0; overflow:auto; }

/* table */
.tr { display:grid; align-items:center; min-height:46px; border-bottom:1px solid var(--line); padding-right:8px; }
.tr:not(.th):hover { background:var(--hover); }
.tr.sel { background:var(--accent-soft); }
.th { position:sticky; top:0; background:#fff; min-height:34px; z-index:1; border-bottom:1px solid var(--border); font:400 14px var(--font); color:var(--muted); }
.tr > div { padding:0 4px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tr > div.wrap { white-space:normal; font-size:14px; font-weight:400; line-height:1.3; padding:4px; }
.g-up { grid-template-columns:44px 32px minmax(200px,1fr) 112px 124px 92px 72px minmax(190px,300px); }
.g-up.res { grid-template-columns:14px 32px minmax(200px,1fr) 112px 124px 92px 72px minmax(190px,300px); }
.g-in { grid-template-columns:44px minmax(200px,1fr) 124px 170px 130px 100px 120px; min-height:40px; }
.g-bk { grid-template-columns:190px minmax(220px,1fr) 170px 150px; min-height:42px; }
.g-bk > div:first-child, .g-in > div:first-child { padding-left:14px; }
.tone-good{color:var(--good)} .tone-bad{color:var(--bad)} .tone-warn{color:var(--warn)} .tone-accent{color:var(--accent-dark)} .tone-muted{color:var(--muted)}
.s { font-weight:400; }
.ic { display:flex; justify-content:center; }

/* checkbox */
.cb { appearance:none; -webkit-appearance:none; width:18px; height:18px; margin:0 0 0 12px; border:1.5px solid #5b6b82; border-radius:4px; background:#fff; cursor:pointer; position:relative; }
.cb:hover:not(:disabled) { border-color:var(--accent); }
.cb:checked { background:var(--accent); border-color:var(--accent); }
.cb:checked::after { content:""; position:absolute; left:5px; top:1px; width:4px; height:9px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
.cb:disabled { opacity:.65; cursor:default; }

/* empty + log */
.empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 20px 60px; }
.empty h2 { margin:0 0 6px; font-size:24px; font-weight:400; color:var(--navy); }
.empty p { margin:0; color:var(--muted); font-size:14px; white-space:pre-line; }
.empty.good h2 { color:var(--good); } .empty.accent h2 { color:var(--accent); }
.log { margin:0; padding:14px; font:14px/1.55 var(--font); white-space:pre-wrap; user-select:text; -webkit-user-select:text; cursor:text; }

/* footer */
.foot { height:66px; background:#fff; border-top:1px solid var(--border); display:flex; align-items:center; padding:0 20px; gap:12px; flex:none; }
.foot label { display:flex; align-items:center; gap:8px; cursor:pointer; }
.foot .cb { margin:0; }
.foot .sep { width:1px; height:20px; background:var(--border); margin:0 6px; }
.foot .grow { flex:1; }
.foot .btn.primary { height:42px; min-width:200px; }
.cnt { color:var(--muted); }

/* power plan */
.pw { padding:18px 22px 26px; max-width:1040px; }
.pw section { margin-bottom:24px; }
.pw h3 { margin:0 0 10px; font-size:16px; font-weight:400; color:var(--navy); }
.hwgrid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px 20px; }
.hwgrid .k { color:var(--muted); font-size:14px; }
.hwgrid .v { font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rec { padding:10px 14px; border-radius:6px; background:var(--accent-soft); display:flex; gap:10px; align-items:flex-start; }
.rec .ico { color:var(--accent); margin-top:2px; }
.rec small { color:var(--muted); display:block; margin-top:2px; }
.prow { display:grid; grid-template-columns:28px 210px minmax(0,1.2fr) minmax(0,1fr) 120px; align-items:center; gap:8px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; cursor:pointer; }
.prow:hover { background:var(--hover); }
.prow.on { border-color:var(--accent); background:var(--accent-soft); }
.prow .n { font-weight:400; }
.prow .m { color:var(--muted); font-size:14px; }
.badge { font:400 14px var(--font); color:var(--accent-dark); border:1px solid #aabeeb; border-radius:10px; padding:1px 8px; justify-self:end; background:#fff; }
.radio { appearance:none; -webkit-appearance:none; width:18px; height:18px; margin:0; border:1.5px solid #5b6b82; border-radius:50%; background:#fff; cursor:pointer; position:relative; }
.radio:checked { border-color:var(--accent); }
.radio:checked::after { content:""; position:absolute; inset:3px; border-radius:50%; background:var(--accent); }
.opts { display:grid; gap:8px; }
.opts label { display:flex; align-items:center; gap:10px; cursor:pointer; }
.opts label.off { color:var(--off-text); cursor:default; }
.opts .cb { margin:0; }
.ptbl .tr { grid-template-columns:210px minmax(0,1fr) minmax(0,1.1fr) 250px; min-height:38px; padding-right:0; }
.ptbl { border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.ptbl .th { position:static; }
.ptbl .tr > div { padding:0 10px; }
.ptbl .tr:last-child { border-bottom:0; }
.note-warn { color:var(--warn); font-weight:400; margin:0 0 10px; }
.rep { border:1px solid var(--line); border-radius:6px; padding:14px 16px; }
.rep h4 { margin:12px 0 4px; font-size:14px; color:var(--muted); font-weight:400; }
.rep h4:first-child { margin-top:0; }
.rep ul { margin:0; padding-left:18px; } .rep li { margin:2px 0; }
.rep .two { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.rep .kv { display:grid; grid-template-columns:200px 1fr; gap:2px 10px; font-size:14px; }
.rep .kv span:nth-child(odd) { color:var(--muted); }
.chip { display:inline-flex; align-items:center; gap:6px; font-weight:400; }
.cmp { margin-top:12px; }
.cmp .tr { grid-template-columns:260px 1fr 1fr; min-height:34px; padding-right:0; }
.cmp .tr > div { padding:0 10px; }
.cmp .diff { background:var(--warn-soft); }

/* memory */
.mbar { display:flex; height:16px; border-radius:8px; overflow:hidden; background:var(--line); margin-bottom:10px; }
.mbar i { display:block; height:100%; }
.mbar .u { background:var(--accent-dark); } .mbar .sb { background:#6b93ee; } .mbar .fr { background:#b4caf7; }
.mleg { display:flex; gap:18px; margin-bottom:16px; color:var(--muted); font-size:14px; }
.mleg span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; background:var(--c); }
.mem { padding:18px 22px 26px; }
.mcols { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:20px; align-items:start; }
@media (max-width:1000px) { .mcols { grid-template-columns:minmax(0,1fr); } }
.mcard { border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin:0; }
.mcard h3 { margin:0 0 12px; font-size:16px; font-weight:400; color:var(--navy); }
.mem .hwgrid { grid-template-columns:repeat(2,minmax(0,1fr)); }
.mhead { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.mhead h3 { margin:0; flex:1; }
.mhelp { margin:16px 0 0; color:var(--muted); }
.brow { display:grid; grid-template-columns:28px minmax(0,1fr); gap:4px 8px; padding:12px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; cursor:pointer; }
.brow:hover { background:var(--hover); }
.brow.on { border-color:var(--accent); background:var(--accent-soft); }
.brow .cb { margin:3px 0 0; }
.brow .n { font-weight:400; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; }
.brow .w { color:var(--muted); font-size:14px; grid-column:2; }
.brow .badge { background:#fff; }
.grow-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px; padding:8px 12px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; }
.grow-row .gname { min-width:140px; }
.grow-row label { display:flex; align-items:center; gap:8px; cursor:pointer; }
.grow-row .cb { margin:0; }
.sel { font:400 14px var(--font); height:30px; border:1px solid #aabeeb; border-radius:6px; background:#fff; color:var(--text); padding:0 8px; max-width:100%; }
/* Windows type scale: 12px regular for everything; semibold only for titles, like Explorer's selected tab and dialog titles */
.top h1, .empty h2, .pw h3, .mcard h3, .dlg h3, .tab.on, .brow .n, .prow .n, .mrow .k b, .rec b { font-weight:600; }
.mrow { margin:0 0 16px; }
.mrow .k b { font-weight:400; display:block; }
.mrow .k small { color:var(--muted); font-size:14px; }
.mrow .ctl { display:flex; align-items:center; gap:14px; margin-top:6px; }
.mrow .val { font-weight:400; color:var(--navy); min-width:64px; text-align:right; }
.rng { flex:1; min-width:0; margin:0; height:22px; accent-color:var(--accent); cursor:pointer; }
.now { margin-top:4px; padding:10px 14px; border-radius:6px; background:var(--accent-soft); }
.now.go { background:#d6e4ff; }

/* modal */
.shade { position:fixed; inset:0; background:rgba(15,37,71,.35); display:flex; align-items:center; justify-content:center; z-index:10; }
.dlg { width:440px; background:#fff; border-radius:10px; padding:22px; box-shadow:0 12px 40px rgba(15,37,71,.3); }
.dlg h3 { margin:0 0 8px; font-size:18px; color:var(--navy); }
.dlg p { margin:0 0 6px; color:var(--muted); }
.dlg .acts { margin-top:18px; display:flex; justify-content:flex-end; gap:8px; }
</style>
</head>
<body oncontextmenu="return false">
<div id="app"></div>
<script>
const I = {
  check:'<path d="M4 12.5l5 5L20 6.5"/>', cross:'<path d="M6 6l12 12M18 6L6 18"/>', info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/>',
  up:'<path d="M12 20V5M6 10.5l6-6 6 6"/>', dot:'<circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/>', ring:'<circle cx="12" cy="12" r="7"/>',
  minus:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>', shield:'<path d="M12 3l7.5 3v6c0 4.2-3 7.4-7.5 9-4.5-1.6-7.5-4.8-7.5-9V6z"/><path d="M8.8 12l2.3 2.3 4.2-4.6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>'
};
const ico = (n, cls='') => n ? `<svg class="ico ${cls}" viewBox="0 0 24 24">${I[n]}</svg>` : '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const send = (cmd, o={}) => window.ipc.postMessage(JSON.stringify({cmd, ...o}));
let S = null;

const stateIcon = {ok:['check','good'], fail:['cross','bad'], skip:['minus','warn'], dl:['dot','accent'], inst:['dot','accent'], wait:['ring','muted']};

function updatesTable() {
  const res = S.mode !== 'review';
  let h = `<div class="tr th g-up ${res?'res':''}"><div></div><div></div><div>Driver / device</div><div>Type</div><div>Source</div><div>Date</div><div>Size</div><div>${res?'Status':'Notes'}</div></div>`;
  for (const r of S.rows) {
    const [ic, tone] = stateIcon[r.state] || (r.system ? ['shield','warn'] : [null,null]);
    h += `<div class="tr g-up ${res?'res':''}">
      <div>${res ? '' : `<input class="cb" type="checkbox" data-tick="${r.i}" ${r.ticked?'checked':''}>`}</div>
      <div class="ic">${ico(ic, tone)}</div>
      <div title="${esc(r.title)}">${esc(r.title)}</div><div>${esc(r.cls)}</div><div>${esc(r.source)}</div><div>${esc(r.date)}</div><div>${esc(r.size)}</div>
      <div class="wrap tone-${r.tone}" title="${esc(r.tip)}">${esc(r.note)}</div></div>`;
  }
  for (const d of S.infos) {
    h += `<div class="tr g-up"><div></div><div class="ic">${ico('info','muted')}</div>
      <div title="${esc(d.name + '\nHardware ID: ' + d.hwid + '\nไม่พบไดรเวอร์ใน Windows Update หรือ Microsoft Catalog ลองค้นหาในเว็บไซต์ผู้ผลิตด้วย Hardware ID นี้')}">${esc(d.name)}</div>
      <div>${esc(d.cls)}</div><div>—</div><div></div><div></div><div class="s tone-muted">No driver found</div></div>`;
  }
  return h;
}

function installedTable() {
  let h = `<div class="tr th g-in"><div></div><div>Device</div><div>Type</div><div>Manufacturer</div><div>Version</div><div>Driver date</div><div>Status</div></div>`;
  for (const d of S.inventory) {
    h += `<div class="tr g-in"><div>${d.old ? ico('clock','warn') : ''}</div><div title="${esc(d.name)}">${esc(d.name)}</div><div>${esc(d.cls)}</div><div>${esc(d.maker)}</div><div>${esc(d.version)}</div><div>${esc(d.date)}</div>
      <div class="s ${d.old?'tone-warn':'tone-muted'}">${d.old ? `เก่า (${d.age} ปี)` : (d.known ? '<span style="font-weight:400">OK</span>' : '')}</div></div>`;
  }
  return h;
}

function backupsTable() {
  if (!S.backups.length) return `<div class="empty"><p>ยังไม่มีข้อมูลสำรอง\nก่อนเปลี่ยนไดรเวอร์ โปรแกรมจะเก็บไดรเวอร์ตัวเดิมไว้ที่นี่ เพื่อให้ย้อนกลับได้</p></div>`;
  let h = `<div class="tr th g-bk"><div>Backed up</div><div>Device</div><div>Saved version</div><div>Backup</div></div>`;
  S.backups.forEach((b, i) => { h += `<div class="tr g-bk ${S.selectedBackup===i?'sel':''}" data-pick="${i}" style="cursor:pointer"><div>${esc(b.time)}</div><div>${esc(b.device)}</div><div>${esc(b.version)}</div><div>${esc(b.kind)}</div></div>`; });
  return h;
}

function powerPanel() {
  const P = S.power;
  if (!P.loaded) return `<div class="empty"><h2>${P.busy ? "กำลังอ่านข้อมูลเครื่อง" : "Power Plan Manager"}</h2><p>${P.busy ? "กำลังตรวจ CPU หน่วยความจำ และแผนพลังงานที่ใช้อยู่..." : "เปิดแท็บนี้เพื่ออ่านข้อมูลฮาร์ดแวร์"}</p></div>`;
  const h = P.hw || {};
  const sel = P.profiles.find(p => p.key === P.selected) || P.profiles[0];
  const hwItems = [["CPU vendor",h.vendor],["CPU model",h.cpu],["Cores / threads",h.cores],["RAM",h.ram],["Windows",h.windows],["PC type",h.type],["Power source",h.source],["Current power plan",h.plan]];
  const off = (ok) => ok ? "" : "off";
  const opt = (name, on, enabled, text, extra="") => `<label class="${off(enabled)}"><input class="cb" type="checkbox" data-popt="${name}" ${on?"checked":""} ${enabled && !P.busy?"":"disabled"}><span>${text}${enabled?"":" <span class=muted>(ไม่เกี่ยวกับโปรไฟล์นี้)</span>"}</span>${extra}</label>`;
  let h2 = `<div class="pw">
    <section><h3>Hardware information</h3><div class="hwgrid">${hwItems.map(([k,v]) => `<div><div class="k">${k}</div><div class="v" title="${esc(v)}">${esc(v)}</div></div>`).join("")}</div></section>
    <section><div class="rec">${ico("info")}<div><b>Recommended: ${esc(P.recommendedName)}</b><small>${esc(P.why.join(" · "))}</small></div></div></section>
    <section><h3>Performance profile</h3>${P.profiles.map(p => `<label class="prow ${P.selected===p.key?"on":""}"><input class="radio" type="radio" name="tier" data-tier="${p.key}" ${P.selected===p.key?"checked":""} ${P.busy?"disabled":""}>
      <span class="n">${esc(p.title)}</span><span class="m">${esc(p.suited)}</span><span class="m">${esc(p.goal)}</span>${P.recommended===p.key?`<span class="badge">Recommended</span>`:"<span></span>"}</label>`).join("")}</section>
    <section><h3>Options</h3><div class="opts">
      ${opt("restore", P.opts.restore_point, true, "สร้างจุดคืนค่าระบบ (restore point) ก่อนเริ่ม")}
      ${opt("usb", P.opts.usb_off, sel.usb, "ปิด USB selective suspend ไม่ให้ Windows ตัดไฟพอร์ต USB (ไม่บังคับ)")}
      ${opt("pcie", P.opts.pcie_off, sel.pcie, "ตั้ง PCI Express link state เป็น Off ไม่ลดความเร็วการ์ดจอ/SSD เพื่อประหยัดไฟ (ไม่บังคับ)")}
      ${opt("ultimate", P.opts.ultimate, sel.ultimate, "ใช้แผน Ultimate Performance (ไม่บังคับ)", sel.ultimate ? `<button class="btn" data-act="power_compare" ${P.busy?"disabled":""}>Compare with Balanced</button>` : "")}
    </div></section>
    <section><h3>Changes that will be applied</h3>${P.batteryBlock ? `<p class="note-warn">โปรไฟล์ Extreme และ Max ใช้ตอนใช้แบตเตอรี่ไม่ได้ กรุณาเสียบสายชาร์จก่อน</p>` : ""}
      <div class="ptbl"><div class="tr th"><div>Setting</div><div>Now</div><div>After</div><div>Note</div></div>${P.preview.map(r => `<div class="tr"><div>${esc(r.label)}</div><div title="${esc(r.current)}">${esc(r.current)}</div><div title="${esc(r.new)}">${esc(r.new)}</div><div class="muted">${esc(r.note)}</div></div>`).join("")}</div></section>`;
  if (P.cmp) h2 += `<section><h3>Ultimate Performance vs Balanced</h3><p style="margin:0 0 6px">${esc(P.cmp.advice)}</p>${P.cmp.available ? `<div class="ptbl cmp"><div class="tr th"><div>Setting</div><div>Balanced</div><div>Ultimate Performance</div></div>${P.cmp.rows.map(r => `<div class="tr ${r.differs?"diff":""}"><div>${esc(r.label)}</div><div>${esc(r.balanced)}</div><div>${esc(r.ultimate)}</div></div>`).join("")}</div>` : ""}</section>`;
  if (P.report) {
    const R = P.report, ul = (t, a) => `<h4>${t}</h4>${a.length ? `<ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<div class="muted">None</div>`}`;
    const kv = a => `<div class="kv">${a.map(l => `<span>${esc(l.label)}</span><span>${esc(l.value)}</span>`).join("")}</div>`;
    h2 += `<section><h3>Report: ${esc(R.title)} <span class="chip ${R.ok?"good":"bad"}">${ico(R.ok?"check":"cross")}${R.ok?"Success":"Failed"}</span></h3><div class="rep">
      <div class="two"><div><h4>Previous configuration</h4>${kv(R.previous)}</div><div><h4>New configuration</h4>${kv(R.new)}</div></div>
      ${ul("Successfully applied", R.applied)}${ul("Unsupported settings", R.unsupported)}${ul("Failed settings", R.failed)}<h4>Restore status</h4><div>${esc(R.restore)}</div></div></section>`;
  }
  return `<div class="scroll">${h2}</div></div>`;
}

const FMT = {
  poll: v => v < 1000 ? v + " ms" : +(v / 1000).toFixed(1) + " s",
  standby: v => v >= 1024 ? +(v / 1024).toFixed(2) + " GB" : v + " MB",
  free: v => v >= 1024 ? +(v / 1024).toFixed(2) + " GB" : v + " MB",
};
let dragging = false;

function memoryPanel() {
  const M = S.memory, s = M.stats;
  const sl = (name, title, hint, r, val) => `<div class="mrow"><div class="k"><b>${title}</b><small>${hint}</small></div><div class="ctl"><input class="rng" type="range" data-rng="${name}" min="${r[0]}" max="${r[1]}" step="${r[2]}" value="${val}" aria-label="${title}"><span class="val">${FMT[name](val)}</span></div></div>`;
  const items = s ? [["แรมทั้งหมด", s.total], ["กำลังใช้งาน", s.inUse], ["ใช้ได้ (ว่าง + standby)", s.available], ["Standby list (แคช)", s.standby], ["Modified (รอเขียนลงดิสก์)", s.modified], ["ว่าง", s.free]] : [];
  const left = `<section class="mcard"><h3>Memory now</h3>${s ? `<div class="mbar"><i class="u" style="width:${s.pctUse}%"></i><i class="sb" style="width:${s.pctStandby}%"></i><i class="fr" style="width:${s.pctFree}%"></i></div>
      <div class="mleg"><span style="--c:var(--accent-dark)">กำลังใช้งาน</span><span style="--c:#6b93ee">Standby list</span><span style="--c:#b4caf7">ว่าง</span></div>
      <div class="hwgrid">${items.map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join("")}</div>` : `<p class="muted">กำลังอ่านข้อมูลแรม...</p>`}
      <p class="mhelp"><b>Standby list (รายการแคช):</b> ข้อมูลที่ Windows เก็บค้างไว้ในแรมเพื่อให้เปิดโปรแกรมได้เร็วขึ้น เมื่อโปรแกรมไหนต้องการแรม Windows จะคืนพื้นที่ส่วนนี้ให้เอง ดังนั้นรายการเต็มเป็นเรื่องปกติและมักไม่เป็นอันตราย การล้างจะช่วยเฉพาะตอนที่เกมหรือโปรแกรมกระตุกขณะที่รายการนี้ใหญ่และแรมว่างเหลือน้อย หลังล้างใหม่ๆ โปรแกรมอาจเปิดช้าลงเล็กน้อย เพราะ Windows ต้องสะสมแคชใหม่</p></section>`;
  const right = `<section class="mcard"><div class="mhead"><h3>Automatic cleaning</h3>
      <span class="chip tone-${M.on ? "good" : "muted"}">${ico(M.on ? "check" : "ring", "tone-" + (M.on ? "good" : "muted"))}${M.on ? "On · ล้างแล้ว " + M.purges + " ครั้ง" : "Off"}</span>
      <button class="btn ${M.on ? "" : "primary"}" data-mem="auto" data-v="${M.on ? 0 : 1}">${M.on ? "Stop" : "Start"}</button></div>
      <p class="mhelp" style="margin-top:0">เมื่อเปิดอยู่ โปรแกรมจะคอยดูแรมและล้าง standby list ให้เอง แต่จะล้างก็ต่อเมื่อ <b>ทั้งสองเงื่อนไข</b> ด้านล่างเป็นจริงพร้อมกัน เลื่อนแถบเพื่อปรับค่า ค่าใหม่ใช้ทันที โปรแกรมจำค่าที่คุณตั้งไว้ และทำงานต่อได้แม้ย่อเก็บอยู่ใน tray</p>
      ${sl("poll", "ตรวจทุก", "ความถี่ที่โปรแกรมดูแรม", M.pollR, M.poll)}
      ${sl("standby", "เงื่อนไขที่ 1: standby list ใหญ่ตั้งแต่", "ถ้ารายการเล็กอยู่แล้วไม่คุ้มที่จะล้าง", M.standbyR, M.standbyMb)}
      ${sl("free", "เงื่อนไขที่ 2: แรมว่างเหลือไม่เกิน", "ถ้าแรมว่างยังเยอะ ก็ไม่จำเป็นต้องล้าง", M.freeR, M.freeMb)}
      ${s ? `<div class="now ${M.wouldClean ? "go" : ""}"><b>ตอนนี้:</b> standby list ${FMT.standby(M.standbyNowMb)} (ต้องมีอย่างน้อย ${FMT.standby(M.standbyMb)}) · แรมว่าง ${FMT.free(M.freeNowMb)} (ต้องเหลือไม่เกิน ${FMT.free(M.freeMb)}) →
        <b>${M.wouldClean ? "ถ้าเปิดอัตโนมัติไว้ ตอนนี้จะล้าง" : "ตอนนี้ยังไม่ล้าง"}</b></div>` : ""}</section>`;
  return `<div class="scroll"><div class="mem">${M.err ? `<p class="note-warn">${esc(M.err)}</p>` : ""}<div class="mcols">${left}${right}</div></div></div>`;
}

function memoryFooter() {
  const M = S.memory;
  const status = M.note || "พร้อมใช้งาน";
  const tone = M.err ? ["cross", "bad"] : ["ring", "muted"];
  return `<div class="foot"><div class="grow"></div><span class="chip tone-${tone[1]}">${ico(tone[0], "tone-" + tone[1])}${esc(status)}</span><button class="btn primary" data-act="mem_purge">Clean standby list now</button></div>`;
}
function gamesSection(G) {
  const row = (g, i) => `<div class="grow-row"><div class="gname" title="${esc(g.path)}"><b>${esc(g.exe)}</b></div>
    <label><input class="cb" type="checkbox" data-game="${i}" data-what="fso" ${g.fso ? "checked" : ""} ${g.path ? "" : "disabled"} aria-label="Fullscreen optimizations off for ${esc(g.exe)}"><span>ปิด Fullscreen Optimizations</span></label>
    <label><input class="cb" type="checkbox" data-game="${i}" data-what="prio" ${g.prio ? "checked" : ""} aria-label="High priority for ${esc(g.exe)}"><span>ลำดับความสำคัญ CPU/ดิสก์สูง</span></label>
    <button class="btn link" data-gamedel="${i}">Remove</button></div>`;
  const plan = G.plans.length ? `<select class="sel" data-gameplan aria-label="Power plan while gaming">${G.plan ? "" : `<option value="" selected>เลือกแผนพลังงาน...</option>`}${G.plans.map(p => `<option value="${esc(p.guid)}" ${p.guid === G.plan ? "selected" : ""}>${esc(p.name)}</option>`).join("")}${G.plans.some(p => p.name === "TierS Gaming - Max performance") ? "" : `<option value="__max">Max performance (สร้างแผนให้อัตโนมัติ)</option>`}</select>` : `<span class="muted">ไม่พบแผนพลังงาน</span>`;
  return `<section><h3>Per-game settings</h3>
    <p class="mhelp" style="margin:0 0 10px">เลือกไฟล์ .exe ของเกม แล้วเลือกว่าจะให้ทำอะไรกับเกมนั้นโดยเฉพาะ ไม่กระทบโปรแกรมอื่น ลบเกมออกแล้วค่าเดิมกลับคืนให้ทันที</p>
    ${G.list.length ? G.list.map(row).join("") : `<p class="muted" style="margin:0 0 10px">ยังไม่มีเกมในรายการ</p>`}
    <button class="btn" data-act="game_add">Add game...</button>
    <p class="mhelp"><b>ปิด Fullscreen Optimizations:</b> ให้เกมใช้โหมดเต็มจอแบบดั้งเดิม บางเกมหน่วงน้อยลง บางเกมไม่ต่าง ถ้าเกมมีปัญหา (ภาพกะพริบ, alt-tab ช้า) ให้ติ๊กออก<br>
    <b>ลำดับความสำคัญสูง:</b> ให้ Windows จัดคิว CPU และดิสก์ให้เกมนี้ก่อน มีผลทุกครั้งที่เปิดเกม เกมที่มีระบบกันโกงบางตัวอาจไม่ชอบการตั้งค่านี้ ถ้าถูกเตือนหรือเกมไม่ยอมเปิด ให้ติ๊กออก</p></section>
  <section><h3>Power plan while gaming</h3>
    <div class="opts"><label><input class="cb" type="checkbox" data-gameauto ${G.auto ? "checked" : ""} ${G.plan && G.list.length ? "" : "disabled"}><span>สลับเป็นแผนพลังงานแรงเมื่อเปิดเกมในรายการ และคืนแผนเดิมเมื่อปิดเกม</span></label></div>
    <div style="margin:10px 0 0 28px">${plan}</div>
    ${G.note ? `<p class="mhelp" style="margin-top:10px"><b>${esc(G.note)}</b></p>` : ""}
    <p class="mhelp">ต้องเพิ่มเกมในรายการด้านบนก่อน และเลือกแผน เช่น Ultimate Performance หรือ High performance (สร้างได้ที่แท็บ Power plan) โปรแกรมตรวจทุก 2 วินาที ทำงานต่อได้แม้ย่อเก็บอยู่ใน tray ถ้าคอมพิวเตอร์ดับกะทันหันขณะเล่นเกม แผนพลังงานแรงจะค้างไว้จนกว่าจะเปิดโปรแกรมนี้ใหม่และเปิดเกมอีกรอบ หรือเปลี่ยนแผนเองในแท็บ Power plan</p></section>`;
}

function boostPanel() {
  const B = S.boost;
  const row = x => `<label class="brow ${x.on ? "on" : ""}"><input class="cb" type="checkbox" data-boost="${x.id}" ${x.on ? "checked" : ""} aria-label="${esc(x.title)}">
    <span class="n">${esc(x.title)}<span class="badge">${esc(x.effect)}</span>${x.restart ? `<span class="badge">ต้องรีสตาร์ทเครื่อง</span>` : ""}</span><span class="w">${esc(x.why)}</span></label>`;
  const rec = B.items.filter(x => x.rec), opt = B.items.filter(x => !x.rec);
  return `<div class="scroll"><div class="pw">
    ${B.err ? `<p class="note-warn">${esc(B.err)}</p>` : ""}
    <section><div class="rec">${ico("info")}<div><b>ควรคาดหวังแค่ไหน</b><small>ตัวเลือกเหล่านี้ช่วยตัดความหน่วงเล็กๆ และงานเบื้องหลัง ผลที่ได้คือภาพนิ่งขึ้นและเมาส์ตอบสนองดีขึ้น ไม่ได้ทำให้ FPS พุ่งขึ้นมาก ตัวที่ได้ผลมากกว่าคือแผนพลังงาน (แท็บ Power plan) ไดรเวอร์การ์ดจอรุ่นล่าสุด (แท็บ Updates) และการตั้งค่าลดหน่วงในเกมด้านล่าง ทุกสวิตช์ติ๊กออกได้ และจะคืนค่าเดิมที่เคยเป็นให้เป๊ะ</small></div></div></section>
    <section><h3>Recommended</h3>${rec.map(row).join("")}</section>
    <section><h3>Optional</h3><p class="mhelp" style="margin:0 0 10px">ลองเปิดทีละตัว แล้วเก็บไว้เฉพาะตัวที่เล่นเกมแล้วรู้สึกดีขึ้น</p>${opt.map(row).join("")}</section>
    ${gamesSection(B.games)}
    <section><h3>Lowest input lag</h3>
      <p class="mhelp" style="margin-top:0"><b>${esc(B.tipName)}</b> ${esc(B.tip)}${B.gpus ? ` <span class="muted">การ์ดจอที่ตรวจพบ: ${esc(B.gpus)}</span>` : ""}</p>
      <p class="mhelp">เพิ่มเติม: เล่นแบบเต็มจอหรือ borderless และถ้าจอรองรับ G-Sync หรือ FreeSync ให้จำกัดเฟรมเรตต่ำกว่ารีเฟรชเรตของจอสัก 3–5 FPS</p></section>
  </div></div>`;
}

      <p class="mhelp" style="margin-top:0">เมื่ออยู่ใน tray หน้าต่างจะถูกปิดและโปรแกรมใช้หน่วยความจำน้อยมาก ที่ยังทำงานอยู่คือไอคอน tray และการล้างแรมอัตโนมัติ (ถ้าคุณเปิดไว้) คลิกที่ไอคอน tray เพื่อเปิดหน้าต่างอีกครั้ง คลิกขวาจะมีเมนู Open, Automatic memory cleaning, Clean standby list now และ Quit</p>

      <p class="mhelp">ค่าการล้างแรมอัตโนมัติและเงื่อนไขที่ตั้งไว้ถูกจดจำ โปรแกรมจะเริ่มทำงานตามนั้นเองในครั้งถัดไป</p>

function body() {
  if (S.tab === "settings") return settingsPanel();
  if (S.tab === "memory") return memoryPanel();
  if (S.tab === "boost") return boostPanel();
  if (S.tab === "power") return powerPanel();
  if (S.tab === 'installed') return `<div class="scroll">${installedTable()}</div>`;
  if (S.tab === 'backups') return `<div class="scroll">${backupsTable()}</div>`;
  if (S.tab === 'log') return `<div class="scroll"><pre class="log">${esc(S.log)}</pre></div>`;
  let b = '';
  if (S.banner) b = `<div class="banner ${S.banner.kind}">${ico({info:'dot',good:'check',warn:'info',bad:'cross'}[S.banner.kind])}<div class="t">${esc(S.banner.text)}</div><div class="btns">${
    S.banner.buttons.map(x => `<button class="btn ${x.primary?'primary':''} ${x.link?'link':''}" data-banner="${x.id}" ${x.enabled?'':'disabled'}>${esc(x.text)}</button>`).join('')}</div></div>`;
  if (!S.rows.length && !S.infos.length) {
    let c, t, p;
    if (S.busy) { c='accent'; t='กำลังสแกนเครื่อง'; p='ใช้เวลาประมาณ 1–2 นาที'; }
    else if (S.scanned) { c='good'; t='ไดรเวอร์เป็นรุ่นล่าสุดแล้ว'; p='ไม่พบไดรเวอร์ที่ใหม่กว่าในแหล่งที่ตรวจ'; }
    else { c=''; t='สแกนหาไดรเวอร์ใหม่ให้เครื่องนี้'; p='โปรแกรมจะหาไดรเวอร์ที่ใหม่กว่า ให้คุณดูรายการก่อน แล้วค่อยติดตั้ง\nใช้เวลาประมาณ 1–2 นาที และต้องต่อเน็ต'; }
    return b + `<div class="empty ${c}"><h2>${t}</h2><p>${p}</p></div>`;
  }
  const rp = S.report.available && S.report.count > 0 ? `<div class="banner info" style="border-top:1px solid var(--border);border-bottom:0"><div class="t">มีอุปกรณ์ ${S.report.count} ชิ้นที่ไม่พบไดรเวอร์ในแหล่งใดเลย คุณส่ง Hardware ID ของอุปกรณ์เหล่านี้ (ไม่มีข้อมูลส่วนตัว) เพื่อให้เราเพิ่มไดรเวอร์ให้ได้</div>
    <div class="btns"><button class="btn" data-act="report" ${S.report.done||S.report.sending||S.busy?"disabled":""}>${S.report.done?"ส่งแล้ว":(S.report.sending?"กำลังส่ง...":"Report these devices")}</button></div></div>` : "";
  return b + `<div class="scroll">${updatesTable()}</div>` + rp;
}

function pills() {
  const p = S.pills;
  if (!S.scanned) return `<button class="pill" data-tab="installed">${ico('ring','muted')}Not scanned yet</button>`;
  const miss = p.missing > 0 ? ['info','bad',`${p.missing} without a driver`] : ['check','good','No problem devices'];
  return `<button class="pill" data-tab="installed">${ico('dot','muted')}${p.drivers} drivers</button>
    <button class="pill" data-tab="updates">${ico(p.upIcon, p.upTone)}${esc(p.upText)}</button>
    <button class="pill" data-tab="log">${ico(miss[0], miss[1])}${miss[2]}</button>`;
}

function powerFooter() {
  const P = S.power, b = P.busy || S.busy;
  const ic = {Success:["check","good"], Failed:["cross","bad"], Applying:["dot","accent"], "Restore Completed":["check","good"], Ready:["ring","muted"]}[P.status] || ["ring","muted"];
  return `<div class="foot"><button class="btn" data-act="power_backup" ${b?"disabled":""}>Backup settings</button><button class="btn" data-act="power_restore" ${b?"disabled":""}>Restore original</button><button class="btn" data-act="power_undo" ${b?"disabled":""}>Undo last</button><button class="btn link" data-act="power_reset" ${b?"disabled":""}>Reset to Windows default</button>
    <div class="grow"></div><span class="chip tone-${ic[1]}">${ico(ic[0], "tone-"+ic[1])}${esc(P.status)}</span><button class="btn primary" data-act="power_apply" ${b || P.batteryBlock || !P.loaded ? "disabled" : ""}>Apply profile</button></div>`;
}

function footer() {
  if (S.tab === "settings") return `<div class="foot"><div class="grow"></div><span>บันทึกการเปลี่ยนแปลงทันที</span></div>`;
  if (S.tab === "memory") return memoryFooter();
  if (S.tab === "boost") return boostFooter();
  if (S.tab === "power") return powerFooter();
  const busy = S.busy;
  const showSel = S.tab === 'updates' && S.mode === 'review' && S.rows.length && !busy;
  let right = '';
  if (S.tab === 'backups') right = `<button class="btn primary" data-act="rollback" ${S.selectedBackup!=null && !busy ? '' : 'disabled'}>Roll back selected</button>`;
  else if (showSel) right = `<button class="btn primary" data-act="install" ${S.selN>0?'':'disabled'}>${S.selN>0 ? `Install ${S.selN} selected` : 'Install'}</button>`;
  return `<div class="foot">
    ${showSel ? `<label><input class="cb" type="checkbox" data-all ${S.allTicked?'checked':''}><span class="cnt">${S.selN} of ${S.rows.length} selected${S.selSize && S.selN ? ' · ' + esc(S.selSize) : ''}</span></label><span class="sep"></span>` : ''}
    <label title="จุดคืนค่าระบบช่วยให้ย้อนเครื่องกลับได้ ถ้าไดรเวอร์ใหม่ทำให้เกิดปัญหา\nWindows สร้างได้วันละ 1 ครั้ง ถ้าสร้างไม่ได้ โปรแกรมจะบันทึกไว้ใน Log แล้วทำงานต่อ"><input class="cb" type="checkbox" data-rp ${S.restorePoint?'checked':''} ${busy?'disabled':''}><span style="${busy?'color:var(--off-text)':''}">สร้างจุดคืนค่าระบบ (restore point) ก่อนติดตั้ง</span></label>
    <div class="grow"></div>${right}</div>`;
}

function render() {
  if (!S) return;
  const sc = document.querySelector('.scroll'); const top = sc ? sc.scrollTop : 0;
  const noScan = S.tab === 'memory' || S.tab === 'power' || S.tab === 'boost' || S.tab === 'settings'; // these tabs have nothing to do with scanning drivers
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.rng : null;
  const tabs = [['updates','Updates'],['installed','Installed drivers'],['backups','Backups'],['power','Power plan'],['boost','Game boost'],['memory','Memory'],['settings','Settings'],['log','Log']];
  const prog = S.busy ? (S.progress == null ? '<div class="bar indet"><i></i></div>' : `<div class="bar"><i style="width:${Math.round(S.progress*100)}%"></i></div>`) : '<div class="bar"></div>';
  document.getElementById('app').style.display = 'contents';
  document.getElementById('app').innerHTML = `
    <div class="top"><img src="__LOGO__" alt=""><h1>TierS Driver Manage</h1><span class="sep"></span><span class="machine" title="${esc(S.machine)}">${esc(S.machine)}</span><span class="grow"></span>
      ${S.update ? `<button class="btn" data-act="update" ${S.busy?'disabled':''} title="${esc(S.update.notes)}">Update to ${esc(S.update.version)}</button>` : ''}<span class="ver">v${esc(S.version)}</span></div>
    <div class="tool">${noScan ? '' : `<div class="row"><button class="btn primary" data-act="scan" ${S.busy?'disabled':''} title="F5">Scan drivers</button>
      <span class="status tone-${S.statusTone}">${ico(S.statusIcon, 'tone-'+S.statusTone)}${esc(S.status)}</span></div>`}${prog}</div>
    <div class="tabs">${tabs.map(([k,n]) => `<button class="tab ${S.tab===k?'on':''}" data-tab="${k}">${n}</button>`).join('')}<div class="pills">${noScan ? '' : pills()}</div></div>
    <div class="main"><div class="card">${body()}</div></div>
    ${footer()}
    ${S.power.confirmReset ? `<div class="shade"><div class="dlg"><h3>Reset to Windows default</h3><p>คืนแผนพลังงานมาตรฐานของ Windows และลบแผนที่สร้างเองออก</p><p>แผนที่สร้างเองจะถูกสำรองลงโฟลเดอร์ก่อน ถ้าสำรองไม่สำเร็จจะไม่ลบอะไรเลย</p>
      <div class="acts"><button class="btn" data-act="power_reset_no">Cancel</button><button class="btn primary" data-act="power_reset_yes">Reset</button></div></div></div>` : ""}
    ${S.confirm ? `<div class="shade"><div class="dlg"><h3>Roll back driver</h3><p>ย้อน ${esc(S.confirm.device)} กลับเป็นเวอร์ชัน ${esc(S.confirm.version)} ใช่ไหม</p><p>ไดรเวอร์ที่ใช้อยู่ตอนนี้จะถูกถอดออกจากเครื่อง และอาจต้องรีสตาร์ทเครื่อง</p>
      <div class="acts"><button class="btn" data-act="rollbackNo">Cancel</button><button class="btn primary" data-act="rollbackYes">Roll back</button></div></div></div>` : ''}`;
  const sc2 = document.querySelector('.scroll'); if (sc2) sc2.scrollTop = top;
  if (focused) { const f = document.querySelector('[data-rng="' + focused + '"]'); if (f) f.focus(); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-banner],[data-pick],[data-mem],[data-gamedel]'); if (!t || t.disabled) return;
  if (t.dataset.gamedel !== undefined) send('game_remove', {i: +t.dataset.gamedel});
  else if (t.dataset.act) send(t.dataset.act);
  else if (t.dataset.mem) send('mem_' + t.dataset.mem, {v: +t.dataset.v});
  else if (t.dataset.tab) send('tab', {tab: t.dataset.tab});
  else if (t.dataset.banner) send('banner', {id: t.dataset.banner});
  else if (t.dataset.pick) send('pick', {i: +t.dataset.pick});
});
// sliders: the value text follows the thumb at once; the page is not redrawn while the thumb is held (a redraw would drop it)
document.addEventListener('pointerdown', e => { if (e.target.dataset && e.target.dataset.rng) dragging = true; });
const drop = () => { if (dragging) { dragging = false; if (S) render(); } };
document.addEventListener('pointerup', drop); document.addEventListener('pointercancel', drop);
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.rng) return;
  t.closest('.mrow').querySelector('.val').textContent = FMT[t.dataset.rng](+t.value);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.rng) { send('mem_' + t.dataset.rng, {v: +t.value}); return; }
  if (t.dataset.game !== undefined) { send('game_set', {i: +t.dataset.game, what: t.dataset.what, v: t.checked ? 1 : 0}); return; }
  if (t.dataset.gameauto !== undefined) { send('game_auto', {v: t.checked ? 1 : 0}); return; }
  if (t.dataset.gameplan !== undefined) { send('game_plan', {guid: t.value}); return; }
  if (t.dataset.boost) { send('boost_set', {id: t.dataset.boost, v: t.checked ? 1 : 0}); return; }
  if (t.dataset.set) { send('set_' + t.dataset.set, {v: t.checked ? 1 : 0}); return; }
  if (t.dataset.tick !== undefined) send('tick', {i: +t.dataset.tick, on: t.checked});
  else if (t.dataset.all !== undefined) send('tickAll', {on: t.checked});
  else if (t.dataset.rp !== undefined) send('restorePoint', {on: t.checked});
  else if (t.dataset.tier !== undefined) send('power_tier', {tier: t.dataset.tier});
  else if (t.dataset.popt !== undefined) send('power_opt', {name: t.dataset.popt, on: t.checked});
});
document.addEventListener('keydown', e => {
  if (e.key === 'F5') { e.preventDefault(); if (S && !S.busy) send('scan'); }
  if (e.ctrlKey && '12345678'.includes(e.key)) send('tab', {tab: ['updates','installed','backups','power','boost','memory','settings','log'][+e.key - 1]});
  if (e.key === 'Escape' && S && S.confirm) send('rollbackNo');
});
document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, {passive:false});
window.setState = s => { S = s; if (!dragging) render(); };
window.ipc.postMessage(JSON.stringify({cmd:'ready'}));
</script>
</body>
</html>
