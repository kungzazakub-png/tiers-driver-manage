[package]
name = "tiers-driver-manage"
version = "2.0.0"
edition = "2021"
description = "TierS Driver Manage - scan and install drivers"
publish = false

[lib]
name = "tdm"
path = "src/lib.rs"

[[bin]]
name = "tiers-driver-manage"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true


[profile.dev.package."*"]
opt-level = 3

