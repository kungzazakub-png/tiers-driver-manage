[package]
name = "tiers-driver-manage"
version = "2.4.0"
edition = "2021"
description = "TierS Driver Manage - scan and install drivers"
publish = false

[lib]
name = "tdm"
path = "src/lib.rs"

[[bin]]
name = "tiers-driver-manage"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
wry = "0.57"
tao = "0.37"
tray-icon = { version = "0.26", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
wmi = "0.18"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip",
  "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_UpdateAgent", "Win32_System_Restore", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Power", "Win32_Security", "Win32_System_SystemInformation","Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true


[profile.dev.package."*"]
opt-level = 3






